<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANTERNFALL</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #14132b;
    color: #f2ead8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    box-sizing: border-box;
  }
  #game {
    display: block;
    width: min(960px, 100%);
    height: auto;
    aspect-ratio: 960 / 600;
    background: #14132b;
    border: 1px solid #3a3654;
    border-radius: 8px;
    box-shadow: 0 0 48px rgba(255, 179, 71, 0.12);
    touch-action: none;
  }
  .hint {
    margin: 0;
    font-size: 13px;
    color: #9d97c4;
    text-align: center;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600" aria-label="LANTERNFALL: build towers beside the path to defend the Ember Lantern from waves of shadow creatures"></canvas>
<p id="status" role="status" aria-live="polite">LANTERNFALL loading.</p>
<p class="hint">Click a plot to build &middot; 1/2/3 pick a tower &middot; Enter sends the next wave &middot; Space pauses &middot; M mutes</p>
<noscript><p>LANTERNFALL needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
